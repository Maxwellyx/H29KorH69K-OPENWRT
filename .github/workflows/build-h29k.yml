name: Build H29K RM500U

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-h29k.yml'
      - 'ci/h29k/**'

permissions:
  contents: read

concurrency:
  group: h29k-rm500u-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: H29K Pro 2025 / RM500U
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_DIR: /tmp/h29k-build/openwrt
      BUILD_LOG_DIR: /tmp/h29k-build/logs
      FIRMWARE_OUTPUT_DIR: /tmp/h29k-build/firmware
      DEVTOOLS_SUFFIX: M
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      BUILD_JOBS: '2'
    steps:
      - name: Check out adaptation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check scripts
        run: |
          bash -n ci/h29k/build.sh ci/h29k/apply-adaptation.sh
          python3 -m py_compile ci/h29k/verify-image.py
          python3 -m json.tool ci/h29k/source-lock.json >/dev/null
      - name: Prepare hosted Linux runner
        run: |
          # These are preinstalled SDKs on the disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates libelf-dev libzstd-dev pkgconf subversion \
            xsltproc zstd patch ccache
          df -h
          free -h
      - name: Prepare locked OpenWrt source and feeds
        run: bash ci/h29k/build.sh prepare
      - name: Configure H29K and validate required packages
        run: bash ci/h29k/build.sh configure
      - name: Download build sources
        run: bash ci/h29k/build.sh download
      - name: Compile firmware
        run: bash ci/h29k/build.sh compile
      - name: Verify and package firmware
        run: bash ci/h29k/build.sh package
      - name: Upload firmware and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: H29K-RM500U-${{ github.run_number }}
          path: ${{ env.FIRMWARE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs even if compilation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: H29K-build-logs-${{ github.run_number }}
          path: ${{ env.BUILD_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

