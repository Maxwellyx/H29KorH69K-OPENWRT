name: Build H29K RM502Q-GL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-h29k.yml'
      - 'ci/h29k/**'

permissions:
  contents: read

concurrency:
  group: h29k-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: H29K Pro 2025 / RM502Q-GL
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_DIR: /tmp/h29k-build/openwrt
      BUILD_LOG_DIR: /tmp/h29k-build/logs
      FIRMWARE_OUTPUT_DIR: /tmp/h29k-build/firmware
      DEVTOOLS_SUFFIX: M
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      BUILD_JOBS: '4'
      CCACHE_MAXSIZE: 2GiB
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out adaptation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check scripts
        run: |
          bash -n ci/h29k/build.sh
          bash -n ci/h29k/apply-adaptation.sh
          sh -n ci/h29k/modemd.init
          node -e 'for (const f of process.argv.slice(1)) new Function(require("fs").readFileSync(f, "utf8"));' ci/h29k/luci-views/overview.js ci/h29k/luci-views/service.js
          python3 -m py_compile ci/h29k/verify-image.py ci/h29k/normalize-aic-source.py
          python3 -m json.tool ci/h29k/source-lock.json >/dev/null
      - name: Prepare hosted Linux runner
        run: |
          # These are preinstalled SDKs on the disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates libelf-dev libzstd-dev pkgconf subversion \
            xsltproc zstd patch ccache
          df -h
          free -h
          nproc
      - name: Prepare locked OpenWrt source and feeds
        run: bash ci/h29k/build.sh prepare
      - name: Restore source downloads and compiler cache
        id: h29k-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            /tmp/h29k-build/openwrt/dl
            /tmp/h29k-build/openwrt/.ccache
          key: h29k-ubuntu24.04-${{ runner.arch }}-v1-${{ hashFiles('ci/h29k/source-lock.json', 'ci/h29k/h29k.seed') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h29k-ubuntu24.04-${{ runner.arch }}-v1-${{ hashFiles('ci/h29k/source-lock.json', 'ci/h29k/h29k.seed') }}-
            h29k-ubuntu24.04-${{ runner.arch }}-v1-
      - name: Configure H29K and validate required packages
        run: bash ci/h29k/build.sh configure
      - name: Download build sources
        run: bash ci/h29k/build.sh download
      - name: Compile firmware
        run: bash ci/h29k/build.sh compile
      - name: Verify and package firmware
        run: bash ci/h29k/build.sh package
      - name: Upload firmware and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: H29K-RM502Q-GL-${{ github.run_number }}
          path: ${{ env.FIRMWARE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Save source downloads and compiler cache after success or failure
        if: ${{ !cancelled() && steps.h29k-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            /tmp/h29k-build/openwrt/dl
            /tmp/h29k-build/openwrt/.ccache
          key: ${{ steps.h29k-cache.outputs.cache-primary-key }}
      - name: Upload build logs even if compilation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: H29K-build-logs-${{ github.run_number }}
          path: ${{ env.BUILD_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14
